<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Contoh Intro</title>
<link rel="stylesheet" href="../../style/tema.css">
<style>
  #bg { position:absolute; inset:0; background: radial-gradient(circle at 50% 50%, var(--bg-2), var(--bg) 70%); }
  .circle { position:absolute; border-radius:50%; }
  #c1 { width:520px; height:520px; left:700px; top:280px; border:14px solid var(--primary); box-sizing:border-box; }
  #c2 { width:160px; height:160px; left:880px; top:460px; background:var(--accent); }
  #title { position:absolute; width:100%; top:430px; text-align:center; font-size:140px; font-weight:800; letter-spacing:-2px; }
  #title span { display:inline-block; }
  #sub { position:absolute; width:100%; top:620px; text-align:center; font-size:44px; color:var(--muted); }
  #bar { position:absolute; left:760px; top:600px; height:8px; background:var(--primary); border-radius:4px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="c1" class="circle"></div>
  <div id="c2" class="circle"></div>
  <div id="title"></div>
  <div id="bar"></div>
  <div id="sub">Motion graphic tanpa video</div>
</div>
<script>
// ===== Konfigurasi =====
window.DURATION = 5;   // saat
window.FPS = 30;

// ===== Helper animasi (deterministik — bergantung pada masa t sahaja) =====
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const prog  = (t, start, dur) => clamp((t - start) / dur);          // 0..1
const lerp  = (a, b, p) => a + (b - a) * p;
const ease = {
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inOutCubic: p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2,
  outBack: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); },
};

const TEXT = "KEMBARA";
const title = document.getElementById('title');
title.innerHTML = [...TEXT].map(ch => `<span>${ch}</span>`).join('');
const letters = [...title.children];
const $ = id => document.getElementById(id);

// ===== Fungsi utama: lukis keadaan pada masa t (saat) =====
window.seek = function (t) {
  // Bulatan besar: muncul (scale) lalu mengecil & pudar
  const p1 = ease.outBack(prog(t, 0, 0.8));
  const out = ease.inOutCubic(prog(t, 1.4, 0.8));
  $('c1').style.transform = `scale(${lerp(0, 1, p1) * lerp(1, 2.6, out)}) rotate(${t*40}deg)`;
  $('c1').style.opacity = 1 - out;

  // Bulatan kecil: pop masuk, kemudian hilang
  const p2 = ease.outBack(prog(t, 0.3, 0.6));
  const out2 = ease.inOutCubic(prog(t, 1.3, 0.5));
  $('c2').style.transform = `scale(${p2 * (1 - out2)})`;

  // Huruf tajuk masuk satu-satu (stagger)
  letters.forEach((el, i) => {
    const p = ease.outCubic(prog(t, 1.6 + i * 0.07, 0.6));
    el.style.opacity = p;
    el.style.transform = `translateY(${lerp(80, 0, p)}px)`;
  });

  // Garisan bawah memanjang
  const pb = ease.inOutCubic(prog(t, 2.4, 0.7));
  $('bar').style.width = `${lerp(0, 400, pb)}px`;
  $('bar').style.left = `${960 - lerp(0, 400, pb) / 2}px`;

  // Subtajuk fade-in
  const ps = ease.outCubic(prog(t, 2.8, 0.7));
  $('sub').style.opacity = ps;
  $('sub').style.transform = `translateY(${lerp(30, 0, ps)}px)`;

  // Fade-out keseluruhan di hujung
  $('stage').style.opacity = 1 - prog(t, DURATION - 0.5, 0.5);
};

// Pratonton di browser (tidak digunakan semasa render)
if (!new URLSearchParams(location.search).has('render')) {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else { seek(0); }
</script>
</body>
</html>
